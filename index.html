<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    # modified the title
    <title> Q&A CHATBOT </title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root{--bg:#f4f6f8;--card:#fff;--accent:#0b5cff;--muted:#6b7280}
        html,body{height:100%}
        body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;align-items:center;justify-content:center;background:var(--bg)}
        .chat-wrapper{width:460px;max-width:96%;height:640px;background:var(--card);box-shadow:0 6px 22px rgba(15,23,42,.08);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
        .header{padding:14px 18px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;gap:12px}
        .avatar{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6ea8ff)}
        .title{font-weight:600}
        .body{flex:1;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg, rgba(11,92,255,0.02), transparent)}
        .msg{max-width:78%;padding:10px 12px;border-radius:10px;line-height:1.3}
        .msg.user{align-self:flex-end;background:#0b5cff;color:#fff;border-bottom-right-radius:4px}
        .msg.bot{align-self:flex-start;background:#f3f6fb;color:#0b1a3a;border-bottom-left-radius:4px}
        .footer{padding:12px;border-top:1px solid #eef2f7;display:flex;gap:8px}
        .input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #e6ecf3;background:#fff}
        .send{padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer}
        .send:disabled{opacity:.6;cursor:default}
        .meta{padding:8px 12px;font-size:12px;color:var(--muted);text-align:center}
    </style>
</head>
<body>
    <div class="chat-wrapper" role="application" aria-label="Chatbot">
        <div class="header">
            <div class="avatar" aria-hidden="true"></div>
            <div>
                <div class="title">QA Chat (RAG)</div>
                <div style="font-size:12px;color:#6b7280">Simple classic interface</div>
            </div>
        </div>

        <div id="messages" class="body" aria-live="polite"></div>

        <div class="footer">
            <input id="input" class="input" type="text" placeholder="Ask a question..." aria-label="Message input" />
            <button id="send" class="send">Send</button>
        </div>
        <div class="meta">Press Enter to send • Backend endpoint: POST /api/chat (JSON { "message": "..." })</div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        function addMessage(text, who='bot') {
            const m = document.createElement('div');
            m.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
            m.textContent = text;
            messagesEl.appendChild(m);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            inputEl.value = '';
            sendBtn.disabled = true;

            try {
                // Update this URL to match your backend endpoint
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({message: text})
                });

                if (!res.ok) {
                    addMessage('Error: ' + res.statusText);
                    return;
                }

                // Expect JSON { reply: "..." }
                const data = await res.json();
                addMessage(data.reply ?? 'No reply');
            } catch (err) {
                addMessage('Network error');
                console.error(err);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
